    <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio | Gestión de Tareas Académicas</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- CSS propio -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="index.html">
            <i class="bi bi-journal-check"></i> Gestión Académica
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="index.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="tareas.html">Tareas</a></li>
                <li class="nav-item"><a class="nav-link" href="estadisticas.html">Estadísticas</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- ================= CONTENIDO ================= -->
<main class="container my-5">
    <h1 class="mb-2">Bienvenido 👋</h1>
    <p class="text-muted mb-4">Resumen general de tus actividades académicas.</p>

    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <div class="card card-stat bg-total">
                <div class="card-body">
                    <div>
                        <small>Total</small>
                        <h3 id="stat-total" class="mb-0">0</h3>
                    </div>
                    <i class="bi bi-list-task icono"></i>
                </div>
            </div>
        </div>

        <div class="col-6 col-md-3">
            <div class="card card-stat bg-pendientes">
                <div class="card-body">
                    <div>
                        <small>Pendientes</small>
                        <h3 id="stat-pendientes" class="mb-0">0</h3>
                    </div>
                    <i class="bi bi-hourglass-split icono"></i>
                </div>
            </div>
        </div>

        <div class="col-6 col-md-3">
            <div class="card card-stat bg-completadas">
                <div class="card-body">
                    <div>
                        <small>Completadas</small>
                        <h3 id="stat-completadas" class="mb-0">0</h3>
                    </div>
                    <i class="bi bi-check2-circle icono"></i>
                </div>
            </div>
        </div>

        <div class="col-6 col-md-3">
            <div class="card card-stat bg-vencidas">
                <div class="card-body">
                    <div>
                        <small>Vencidas</small>
                        <h3 id="stat-vencidas" class="mb-0">0</h3>
                    </div>
                    <i class="bi bi-exclamation-triangle icono"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="card form-card">
        <div class="card-body">
            <h5 class="card-title mb-3"><i class="bi bi-calendar-event"></i> Próximas entregas</h5>
            <div id="lista-proximas"></div>
        </div>
    </div>
</main>

<footer class="text-center text-muted py-4">
    <small>© 2025 Sistema de Gestión de Tareas Académicas - SENATI</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas | Gestión Académica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="index.html"><i class="bi bi-journal-check"></i> Gestión Académica</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="tareas.html">Tareas</a></li>
                <li class="nav-item"><a class="nav-link active" href="estadisticas.html">Estadísticas</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container my-5">
    <h1 class="mb-4">Estadísticas de Actividades</h1>

    <div class="row g-4">
        <div class="col-md-6">
            <div class="card form-card">
                <div class="card-body">
                    <h5 class="card-title">Tareas por curso</h5>
                    <div id="stats-curso"></div>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card form-card">
                <div class="card-body">
                    <h5 class="card-title">Tareas por prioridad</h5>
                    <div id="stats-prioridad"></div>
                </div>
            </div>
        </div>

        <div class="col-12">
            <div class="card form-card">
                <div class="card-body">
                    <h5 class="card-title">Progreso general</h5>
                    <div class="d-flex align-items-center gap-3">
                        <div class="progress flex-grow-1" style="height: 24px;">
                            <div class="progress-bar bg-success" id="barra-progreso" style="width: 0%">0%</div>
                        </div>
                        <span id="texto-progreso" class="fw-bold">0%</span>
                    </div>
                    <p class="text-muted mt-2 mb-0" id="detalle-progreso">Sin tareas registradas.</p>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="text-center text-muted py-4">
    <small>© 2025 Sistema de Gestión de Tareas Académicas - SENATI</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/estadisticas.js"></script>
</body>
</html>
